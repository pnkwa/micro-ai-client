<!--
  The lucide `Microscope`, the same glyph the sidebar uses as this app's mark, so the tab and the
  product agree. Brand primary (#249486) on a rounded tile rather than a bare stroke: at 16px a
  line icon on the browser's own background nearly disappears, and a filled tile keeps the
  silhouette readable on a light or dark tab strip alike.

  SVG, with the .ico kept as a fallback for anything that cannot take one.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7" fill="#249486" />
  <g
    transform="translate(4 4)"
    fill="none"
    stroke="#ffffff"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M6 18h8" />
    <path d="M3 22h18" />
    <path d="M14 22a7 7 0 1 0 0-14h-1" />
    <path d="M9 14h2" />
    <path d="M9 12a2 2 0 0 1-2-2V6h6v4a2 2 0 0 1-2 2Z" />
    <path d="M12 6V3a1 1 0 0 0-1-1H9a1 1 0 0 0-1 1v3" />
  </g>
</svg>
